name: Build Zygisk Frida Gadget

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ninja-build

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Install Build Tools
      run: sudo apt-get install -y ninja-build

    - name: Build Zygisk Module
      run: |
        # 验证 NDK 安装
        echo "ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
        
        # 检查 NDK 是否正确安装
        if [ ! -d "$ANDROID_NDK_ROOT" ]; then
          echo "ERROR: ANDROID_NDK_ROOT directory not found: $ANDROID_NDK_ROOT"
          exit 1
        fi
        
        # 列出编译器
        TOOLCHAIN_LLVM="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
        if [ -d "$TOOLCHAIN_LLVM" ]; then
          echo "Found LLVM toolchain at: $TOOLCHAIN_LLVM"
          ls "$TOOLCHAIN_LLVM/bin/clang" 2>/dev/null && echo "clang compiler found" || echo "clang compiler NOT found"
        else
          echo "ERROR: LLVM toolchain not found at $TOOLCHAIN_LLVM"
          exit 1
        fi
        
        mkdir -p build
        cd build
        
        # 使用自定义工具链编译
        echo "Configuring CMake..."
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE="$(pwd)/../android.toolchain.cmake" \
          -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_MAKE_PROGRAM=$(which ninja) \
          -G "Ninja"
        
        echo "Building..."
        # 构建
        ninja -j$(nproc)
        cd ..

    - name: Verify Module Structure
      run: |
        echo "Checking module.prop..."
        test -f module.prop || echo "WARNING: module.prop not found"
        echo "Checking customize.sh..."
        test -f customize.sh || echo "WARNING: customize.sh not found"
        echo "Checking service.sh..."
        test -f service.sh || echo "WARNING: service.sh not found"

    - name: Copy Build Artifacts
      run: |
        # 复制编译生成的 so 文件到 lib 目录
        if [ -f build/lib/arm64-v8a/zygisk.so ]; then
          cp build/lib/arm64-v8a/zygisk.so lib/arm64-v8a/
          echo "zygisk.so copied successfully"
        else
          echo "WARNING: zygisk.so not found"
        fi

    - name: Pack Magisk Module
      run: |
        mkdir -p output
        # 确保包含所有必要文件
        zip -r output/zygisk-frida-gadget.zip . \
          -x "*.git*" ".github*" "build/*" "output/*" "README.md" \
          --include="module.prop" \
          --include="customize.sh" \
          --include="service.sh" \
          --include="lib/*" \
          --include="zygisk/*" \
          --include="include/*"

    - name: Generate Release Notes
      run: |
        echo "# Zygisk Frida Gadget Build" > release_notes.md
        echo "" >> release_notes.md
        echo "Build Date: $(date)" >> release_notes.md
        echo "Commit: ${{ github.sha }}" >> release_notes.md
        echo "" >> release_notes.md
        echo "## Build Artifacts" >> release_notes.md
        echo "- \`zygisk-frida-gadget.zip\`: Magisk module package" >> release_notes.md

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-frida-gadget
        path: output/zygisk-frida-gadget.zip
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: output/zygisk-frida-gadget.zip
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
